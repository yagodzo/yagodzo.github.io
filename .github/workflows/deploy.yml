name: Deploy Chirpy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история обязательна: _plugins/posts-lastmod-hook.rb
          # определяет дату правки поста через `git rev-list --count HEAD`.
          # При shallow-клоне счётчик всегда равен 1 и дата не проставляется.
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          # bundler-cache уже выполняет bundle install, отдельный шаг не нужен
          bundler-cache: true

      - run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      # Ловит битые внутренние ссылки и картинки до деплоя.
      # html-proofer уже был в Gemfile, но никогда не запускался — из-за чего
      # сломанные пути к изображениям уезжали в прод незамеченными.
      - name: Test site
        run: |
          bundle exec htmlproofer _site \
            --disable-external \
            --ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
